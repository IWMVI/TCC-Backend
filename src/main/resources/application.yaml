spring:
  application:
    name: Locadora de Trajes a Rigor

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tcc}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      autocommit: true
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 5
      connection-test-query: SELECT 1

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    deserialization:
      fail-on-unknown-properties: false

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  seeder:
    enabled: ${SEEDER_ENABLED:false}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  auth:
    jwt-secret: ${JWT_SECRET:tcc-dev-secret-change-in-production-min-32-chars}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    registro-publico: ${REGISTRO_PUBLICO:false}
    admin-email: ${ADMIN_EMAIL:admin@locadora.local}
    admin-senha: ${ADMIN_SENHA:Admin@123}
    admin-nome: ${ADMIN_NOME:Administrador}

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.connections.pooling: OFF
    org.hibernate.orm.jdbc: OFF
